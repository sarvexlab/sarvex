name: Bug report
description: Something is not working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not report security vulnerabilities here** — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A failing test or a minimal sequence of commands is ideal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [serving plane, sync plane, control plane, console, WooCommerce plugin, Magento plugin, deployments, docs, other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and environment
      description: Remove tokens, secrets and personal data before pasting.
      render: shell
