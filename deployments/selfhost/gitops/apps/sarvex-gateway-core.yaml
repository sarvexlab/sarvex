apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sarvex-gateway-core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sarvexlab/sarvex
    targetRevision: main
    path: deployments/selfhost/helm/sarvex-gateway
    helm:
      valueFiles: [values-core.yaml]
  destination:
    server: https://kubernetes.default.svc # core cluster's own API server — Argo CD's control plane runs here
    namespace: sarvex-core
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
