{{- if .Values.core }}
# /connector/* -> sync (cmd/root.go's proxyMux rule 2); everything else not
# already claimed by the serving route -> control (rule 3, "else"). Both
# only exist in the core cluster, since sync/control are never deployed to
# edge regions.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sarvex-route-sync
spec:
  parentRefs:
    - name: sarvex-gateway
  hostnames:
    {{- toYaml .Values.hostnames.sync | nindent 4 }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /connector }
      backendRefs:
        - name: sarvex-sync
          port: 8082
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sarvex-route-control
spec:
  parentRefs:
    - name: sarvex-gateway
  hostnames:
    {{- toYaml .Values.hostnames.control | nindent 4 }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / } # "else" catch-all, matches proxyMux's default case
      backendRefs:
        - name: sarvex-control
          port: 8081
{{- end }}
