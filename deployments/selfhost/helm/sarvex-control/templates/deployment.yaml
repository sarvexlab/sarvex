apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sarvex-control.name" . }}
  labels:
    {{- include "sarvex-control.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sarvex-control.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sarvex-control.labels" . | nindent 8 }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        # See sarvex-serving's deployment.yaml comment: control also
        # provisions store signing keypairs (at pairing completion) through
        # jwkmanagement's Vault Transit Encryptor, so it needs the same
        # auto-auth token.
        vault.hashicorp.com/agent-inject-token: "true"
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.mongo.connectionStringSecretPath | quote }}
        vault.hashicorp.com/agent-inject-template-env: |
          {{`{{- with secret "` }}{{ .Values.mongo.connectionStringSecretPath }}{{`" -}}`}}
          export MONGO_CONNECTION_STRING="{{`{{ .Data.data.mongo_connection_string }}`}}"
          export STRIPE_SECRET_KEY="{{`{{ .Data.data.stripe_secret_key }}`}}"
          export STRIPE_WEBHOOK_SECRET="{{`{{ .Data.data.stripe_webhook_secret }}`}}"
          export RESEND_API_KEY="{{`{{ .Data.data.resend_api_key }}`}}"
          export KINDE_ISSUER_URL="{{`{{ .Data.data.kinde_issuer_url }}`}}"
          export KINDE_AUDIENCE="{{`{{ .Data.data.kinde_audience }}`}}"
          {{`{{- end -}}`}}
    spec:
      containers:
        - name: control
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              [ -f /vault/secrets/env ] && . /vault/secrets/env
              export VAULT_ADDR="{{ .Values.vault.address }}"
              export VAULT_TRANSIT_KEY_NAME="sarvex-jwk-signing"
              [ -f /vault/secrets/token ] && export VAULT_TOKEN="$(cat /vault/secrets/token)"
              exec /app --service control \
                --port {{ .Values.service.port }} \
                --configPath /etc/sarvex/config \
                --env {{ .Values.env }} \
                --tls {{ .Values.tls }}
          env:
            - name: REDIS_ADDRESS
              value: {{ .Values.redis.address | quote }}
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/sarvex/config
              readOnly: true
      terminationGracePeriodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: {{ include "sarvex-control.name" . }}-config
