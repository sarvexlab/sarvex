# The serving plane gets its own Deployment+Service, and sarvex-gateway's
# Gateway API Gateway does the path routing, so this chart never needs
# `--service=all` or `--proxyPort` (the in-process reverse proxy). Those stay
# in the binary purely as a `make dev-up-monolith` convenience.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sarvex-serving.name" . }}
  labels:
    {{- include "sarvex-serving.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sarvex-serving.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sarvex-serving.labels" . | nindent 8 }}
      annotations:
        # Vault Agent Injector: renders the secret fields listed in
        # vault.hashicorp.com/agent-inject-secret-* to files under
        # /vault/secrets/*, which entrypoint.sh (below) sources as env vars
        # before exec'ing the binary — this is the ONLY difference between
        # local dev (dev-mode Vault, same annotations) and production (real
        # Vault): the vault.address the injector's sidecar is configured
        # with cluster-wide, not anything in this pod spec.
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        # Renders the injector's own auto-auth token to /vault/secrets/token —
        # exported below as VAULT_TOKEN so jwkmanagement's Vault Transit
        # client (internal/pkg/jwkmanagement/vault.go) can authenticate
        # without a token ever being baked into an image or Helm value.
        vault.hashicorp.com/agent-inject-token: "true"
        vault.hashicorp.com/agent-inject-secret-env: "secret/data/sarvex/serving"
        vault.hashicorp.com/agent-inject-template-env: |
          {{`{{- with secret "secret/data/sarvex/serving" -}}`}}
          export MONGO_CONNECTION_STRING="{{`{{ .Data.data.mongo_connection_string }}`}}"
          export TOKEN_GEN_KEY="{{`{{ .Data.data.token_gen_key }}`}}"
          export BUNDLE_VERIFICATION_KEY="{{`{{ .Data.data.bundle_verification_key }}`}}"
          export KINDE_ISSUER_URL="{{`{{ .Data.data.kinde_issuer_url }}`}}"
          export KINDE_AUDIENCE="{{`{{ .Data.data.kinde_audience }}`}}"
          {{`{{- end -}}`}}
          export VAULT_ADDR="{{ .Values.vault.address }}"
          export VAULT_TRANSIT_KEY_NAME="sarvex-jwk-signing"
          [ -f /vault/secrets/token ] && export VAULT_TOKEN="$(cat /vault/secrets/token)"
    spec:
      containers:
        - name: serving
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            # source the Vault-rendered env file, then exec the real binary
            # — replaces the Dockerfile's default CMD, which ships with an
            # empty --service and crash-loops (see deployments/INFRASTRUCTURE.md).
            - |
              set -e
              [ -f /vault/secrets/env ] && . /vault/secrets/env
              exec /app --service serving \
                --port {{ .Values.service.port }} \
                --configPath /etc/sarvex/config \
                --env {{ .Values.env }} \
                --tls {{ .Values.tls }}
          env:
            - name: REDIS_ADDRESS
              value: {{ .Values.redis.address | quote }}
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/sarvex/config
              readOnly: true
      # 10s grace period matches entry.go's own shutdown timeout — see
      # internal/planes/serving/api/entry.go's Shutdown(ctx) call. Kubernetes
      # sends SIGTERM, the process already handles it correctly; this just
      # keeps the pod from being force-killed before that 10s completes.
      terminationGracePeriodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: {{ include "sarvex-serving.name" . }}-config
